<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arabic UI Components</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="nav">
    <strong>لوحة رضوان</strong>
    <a href="#cards">البطاقات</a>
    <a href="#form">النموذج</a>
  </nav>

  <main class="shell">
    <section class="hero">
      <p>Arabic RTL UI Kit</p>
      <h1>مكونات واجهة عربية جاهزة</h1>
      <p>تصميم واضح، متجاوب، ومناسب للوحة تحكم أو تطبيق طالب أو مشروع ويب عربي.</p>
    </section>

    <section id="cards" class="grid"></section>

    <section id="form" class="panel">
      <h2>نموذج عربي</h2>
      <label>اسم المشروع <input placeholder="مثال: تطبيق سيناكس" /></label>
      <label>الوصف <textarea placeholder="اكتب وصفًا قصيرًا..."></textarea></label>
      <button>حفظ</button>
    </section>
  </main>

  <script src="components.js"></script>
</body>
</html>
